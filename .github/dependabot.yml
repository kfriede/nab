version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: golang.org/x/term
        versions: [">=0.46.0"]
      - dependency-name: golang.org/x/sys
        versions: [">=0.48.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    labels:
      - dependencies
    groups:
      github-actions:
        patterns: ["*"]
