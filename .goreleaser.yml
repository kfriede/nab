version: 2

project_name: nab

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: .
    binary: nab
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/kfriede/nab/cmd.Version={{.Version}}
      - -X github.com/kfriede/nab/cmd.Commit={{.ShortCommit}}
      - -X github.com/kfriede/nab/cmd.BuildDate={{.Date}}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: kfriede
    name: nab

# Formula/nab.rb in kfriede/homebrew-tap is updated by hand after a release.
# Do not add a brews publisher here.
